name: iOS
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  build:
    strategy:
      matrix:
        extraEnv: [FOO=BAR, RCT_NEW_ARCH_ENABLED=1]
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: Enable Corepack
        run: corepack enable
      # Corepack has to be enabled first, otherwise the cache step resolves the
      # runner's global Yarn 1, which refuses to run this project.
      - name: Restore Yarn cache
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: 'yarn'
      - name: Install npm dependencies
        run: yarn --immutable
      - name: Install Pods
        run: ${{matrix.extraEnv}} pod install
        working-directory: example/ios
      - name: Build iOS test app
        run: |
          xcodebuild -workspace WebviewExample.xcworkspace -scheme ReactTestApp -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO build
        working-directory: example/ios
    timeout-minutes: 60
